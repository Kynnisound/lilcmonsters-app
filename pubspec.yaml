name: seamonsters
description: "Lil C Monsters (SeaMonsters) : appli d'eveil pour jeunes enfants, marque Little Cuddly Monsters."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  go_router: ^18.1.1
  flutter_riverpod: ^3.4.3
  audioplayers: ^6.8.1
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  crypto: ^3.0.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/monsters/
    - assets/images/books/
    - assets/images/coloring/
    - assets/images/brand/
    - assets/images/videos/
    - assets/images/scenes/
    - assets/images/puzzle/
    # Assets de travail de Margaux (v1, non valides), copies de design/assets/.
    # Retour arriere : --dart-define=DESIGN_ART_V1=false (lib/core/content/design_art.dart).
    - assets/images/map/
    # Ombres dessinees par Margaux (version de travail, DESIGN_ART_V1)
    - assets/images/shadows/
    - assets/images/shadows/color/
    - assets/images/places/
    - assets/images/icons/
    # Sons de Shada (CC0 / domaine public), .ogg + .m4a, voir assets/audio/SOUNDS_MANIFEST.md
    # Declares fichier par fichier : les .m4a ne servent qu'a iOS et macOS
    # (et au web, ou Safari sur iPhone se declare iOS) ; l'APK et l'AAB
    # n'embarquent que les .ogg. Test : test/audio_assets_test.dart.
    - assets/audio/beach/beach_ambience_loop.ogg
    - path: assets/audio/beach/beach_ambience_loop.m4a
      platforms: [ios, macos, web]
    - assets/audio/map/map_ambience_loop.ogg
    - path: assets/audio/map/map_ambience_loop.m4a
      platforms: [ios, macos, web]
    - assets/audio/ui/ui_back.ogg
    - assets/audio/ui/ui_place_locked.ogg
    - assets/audio/ui/ui_place_unlocked.ogg
    - assets/audio/ui/ui_tap.ogg
    - path: assets/audio/ui/ui_back.m4a
      platforms: [ios, macos, web]
    - path: assets/audio/ui/ui_place_locked.m4a
      platforms: [ios, macos, web]
    - path: assets/audio/ui/ui_place_unlocked.m4a
      platforms: [ios, macos, web]
    - path: assets/audio/ui/ui_tap.m4a
      platforms: [ios, macos, web]
    - assets/audio/puzzle/puzzle_complete.ogg
    - assets/audio/puzzle/puzzle_piece_pickup.ogg
    - assets/audio/puzzle/puzzle_piece_snap.ogg
    - path: assets/audio/puzzle/puzzle_complete.m4a
      platforms: [ios, macos, web]
    - path: assets/audio/puzzle/puzzle_piece_pickup.m4a
      platforms: [ios, macos, web]
    - path: assets/audio/puzzle/puzzle_piece_snap.m4a
      platforms: [ios, macos, web]
    - assets/audio/shadow/shadow_found.ogg
    - assets/audio/shadow/shadow_lantern_off.ogg
    - assets/audio/shadow/shadow_lantern_on.ogg
    - assets/audio/shadow/shadow_level_complete.ogg
    - assets/audio/shadow/shadow_wrong.ogg
    - path: assets/audio/shadow/shadow_found.m4a
      platforms: [ios, macos, web]
    - path: assets/audio/shadow/shadow_lantern_off.m4a
      platforms: [ios, macos, web]
    - path: assets/audio/shadow/shadow_lantern_on.m4a
      platforms: [ios, macos, web]
    - path: assets/audio/shadow/shadow_level_complete.m4a
      platforms: [ios, macos, web]
    - path: assets/audio/shadow/shadow_wrong.m4a
      platforms: [ios, macos, web]
    - assets/audio/common/success_badge.ogg
    - path: assets/audio/common/success_badge.m4a
      platforms: [ios, macos, web]
    # Pads du bac a sable (bruitages de la plage et notes des monstres) a la
    # meme sonie, -22 LUFS (tool/normalize_pads.py, BUG-007). Les sources des
    # notes (assets/sounds/*.wav, tool/gen_sounds.py) ne sont plus embarquees.
    - assets/audio_mix/beach/beach_bubbles.ogg
    - assets/audio_mix/beach/beach_sand.ogg
    - assets/audio_mix/beach/beach_seagull.ogg
    - assets/audio_mix/beach/beach_shell.ogg
    - assets/audio_mix/beach/beach_wave_splash.ogg
    - path: assets/audio_mix/beach/beach_bubbles.m4a
      platforms: [ios, macos, web]
    - path: assets/audio_mix/beach/beach_sand.m4a
      platforms: [ios, macos, web]
    - path: assets/audio_mix/beach/beach_seagull.m4a
      platforms: [ios, macos, web]
    - path: assets/audio_mix/beach/beach_shell.m4a
      platforms: [ios, macos, web]
    - path: assets/audio_mix/beach/beach_wave_splash.m4a
      platforms: [ios, macos, web]
    - assets/audio_mix/notes/note_do.ogg
    - assets/audio_mix/notes/note_la.ogg
    - assets/audio_mix/notes/note_mi.ogg
    - assets/audio_mix/notes/note_re.ogg
    - assets/audio_mix/notes/note_sol.ogg
    - path: assets/audio_mix/notes/note_do.m4a
      platforms: [ios, macos, web]
    - path: assets/audio_mix/notes/note_la.m4a
      platforms: [ios, macos, web]
    - path: assets/audio_mix/notes/note_mi.m4a
      platforms: [ios, macos, web]
    - path: assets/audio_mix/notes/note_re.m4a
      platforms: [ios, macos, web]
    - path: assets/audio_mix/notes/note_sol.m4a
      platforms: [ios, macos, web]

  fonts:
    - family: LuckiestGuy
      fonts:
        - asset: assets/fonts/LuckiestGuy-Regular.ttf
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
